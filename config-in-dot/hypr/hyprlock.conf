source = $HOME/.cache/wal/hyprland-pywal.conf
source = $HOME/.config/hypr/mocha.conf

$accent = $color11
$accentAlpha = $color14
$font = JetBrainsMono Nerd Font
$text = rgb(FFFFFF)
$surface0 = $color11
$red = rgb(FF0000)
$yellow = rgb(FFFF00)

# GENERAL
general {
  disable_loading_bar = true
  hide_cursor = true
}

# BACKGROUND
background {
  monitor = eDP-1 
  path = $HOME/.config/hypr/hyprlock-bkg/eDP-1.png 
  blur_passes = 0
  color = $background
}

background {
  monitor = HDMI-A-1
  path = $HOME/.config/hypr/hyprlock-bkg/HDMI-A-1.png
  blur_passes = 0
  color = $background
}

background {
  monitor = DP-2
  path = $HOME/.config/hypr/hyprlock-bkg/DP-2.png
  blur_passes = 0
  color = $background
}

background {
  monitor = DP-3 
  path = $HOME/.config/hypr/hyprlock-bkg/DP-3.png
  blur_passes = 0
  color = $background
}

# TIME
label {
  monitor =  eDP-1
  text = $TIME
  color = $text
  font_size = 90
  font_family = $font
  position = -30, 0
  halign = center
  valign = top
}

# DATE
label {
  monitor =  eDP-1
  text = cmd[update:43200000] date +"%A, %d %B %Y"
  color = $text
  font_size = 25
  font_family = $font
  position = -30, -150
  halign = center
  valign = top
}

# USER AVATAR
image {
  monitor =  eDP-1
  path = $HOME/.face
  size = 100
  border_color = $accent
  position = 0, 75
  halign = center
  valign = center
}

# INPUT FIELD
input-field {
  monitor =  eDP-1
  size = 400, 60
  outline_thickness = 4
  dots_size = 0.2
  dots_spacing = 0.2
  dots_center = true
  outer_color = $accent
  inner_color = $surface0
  font_color = $text
  fade_on_empty = false
  placeholder_text = <i>󰌾 Logged in as $USER</i>
  hide_input = false
  check_color = $accent
  fail_color = $red
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  capslock_color = $yellow
  position = 0, -47
  halign = center
  valign = center
}
