source = /home/zuki/.cache/wal/hyprland-pywal.conf
source = $HOME/.config/hypr/mocha.conf

$accent = $color11
$accentAlpha = $color14
$font = JetBrainsMono Nerd Font
$text = rgb(FFFFFF)
$surface0 = $color11
$red = rgb(FF0000)
$yellow = rgb(FFFF00)

# GENERAL
general {
  disable_loading_bar = true
  hide_cursor = true
}

# BACKGROUND
background {
  monitor =
  path = $HOME/.config/background.png
  blur_passes = 0
  color = $background
}

# # LAYOUT
# label {
